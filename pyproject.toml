[project]
name = "foundry-relay"
version = "1.0.0"
description = "OpenAI-compatible API gateway for a Microsoft Foundry agent"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
